# _dataset_files.yml
- pattern: '^.*(?:ena|sra)\.tsv$'
  min: 0
  max: 2

- pattern: '^.*family\.soft$'
  min: 0
  max: 1

- pattern: '^.*parsed\.tsv$'
  min: 0
  max: 1

- pattern: '^.*solo.qc.?\.tsv$'
  min: 0
  max: 2

- pattern: '^.*(?:sdrf|idf)\.txt$'
  min: 0
  max: 2

- pattern: '^.*sample_x_run\.tsv$'
  min: 0
  max: 1

- pattern: '^.*sample\.relation\.list$'
  min: 0
  max: 1

- pattern: '^links\.tsv$'
  min: 0
  max: 1

- pattern: '^.*(?:sample|project|run|urls)\.list$'
  min: 0
  max: null

- pattern: '^.*accessions\.tsv$'
  min: 0
  max: null

- pattern: '^.*(?:protocol.tsv|qc.txt|starsolo.tsv|species.txt)$'
  description: 'Old files that may be present in some datasets'
  min: 0
  max: null
