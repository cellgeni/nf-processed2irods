# _star_output.yml
- name:
    pattern: '^output$'
    min: 1
    max: 1

  data_objects:
    - pattern: '^Barcodes\.stats$'
      min: 1
      max: 1

  collections:
    - name:
        min: 1
        max: 1
        pattern: '^Gene$'
      data_objects: !include _gene_files.yml
      collections: !include _gene_collections.yml
      allow_extra_collections: false
      allow_extra_files: false
    
    - name:
        pattern: 'GeneFull$'
        min: 1
        max: 1
      data_objects: !include _gene_files.yml
      collections: !include _gene_collections.yml
      allow_extra_collections: false
      allow_extra_files: false

    - !include _velocyto_block.yml

  allow_extra_files: false
  allow_extra_collections: false
